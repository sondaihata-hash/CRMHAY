services:
  - type: web
    name: crmhay
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --worker-class gthread --threads 2 --preload --max-requests 200 --max-requests-jitter 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
