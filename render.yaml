services:
  - type: web
    name: crmhay
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --preload --max-requests 500 --max-requests-jitter 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DATABASE_URL
        fromDatabase:
          name: crmhay-db
          property: connectionString
      - key: CRM_SECRET_KEY
        sync: false
      - key: CRM_ADMIN_USERNAME
        sync: false
      - key: CRM_ADMIN_PASSWORD
        sync: false
  - type: cron
    name: crmhay-facebook-sync
    env: python
    schedule: "0 */3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scheduled_sync.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DATABASE_URL
        fromDatabase:
          name: crmhay-db
          property: connectionString
databases:
  - name: crmhay-db
    databaseName: crmhay
    user: crmhay
    plan: free
