{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="panel p-4">
      <p class="eyebrow">Bảo mật tài khoản</p>
      <h1 class="page-title mb-3">Đổi mật khẩu</h1>
      <p class="text-muted">Dùng mật khẩu dài, riêng biệt và không chia sẻ cho người khác.</p>
      <form method="post" class="row g-3 mt-2">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="col-12">
          <label class="form-label" for="current_password">Mật khẩu hiện tại</label>
          <input class="form-control" id="current_password" name="current_password" type="password" required autocomplete="current-password">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="new_password">Mật khẩu mới</label>
          <input class="form-control" id="new_password" name="new_password" type="password" minlength="12" required autocomplete="new-password">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="confirmation">Nhập lại mật khẩu mới</label>
          <input class="form-control" id="confirmation" name="confirmation" type="password" minlength="12" required autocomplete="new-password">
        </div>
        <div class="col-12 d-flex gap-2">
          <button class="primary-btn" type="submit">Lưu mật khẩu</button>
          <a class="secondary-btn text-decoration-none" href="{{ url_for('index') }}">Hủy</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
