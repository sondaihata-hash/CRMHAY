{% extends 'base.html' %}
{% block content %}
<div class="section-header"><div><p class="kpi-label mb-2">Chỉnh sửa đơn hàng</p><h1 class="page-title">{{ order.code }}</h1></div><a class="btn secondary-btn" href="/orders">Quay lại</a></div>
<form method="post" class="panel p-4">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
<p><strong>Khách hàng:</strong> {{ order.customer.name }}</p>
<div class="row g-2 mb-3"><div class="col-md-4"><label>Trạng thái<select class="form-select" name="status">{% for status in ['Mới','Đang xử lý','Đang giao','Hoàn tất','Đã hủy','Đã gửi sản xuất'] %}<option {% if order.status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label></div><div class="col-md-8"><label>Địa chỉ giao hàng<input class="form-control" name="delivery_address" value="{{ order.delivery_address or '' }}"></label></div><div class="col-md-6"><label>SĐT Sales<input class="form-control" name="sales_phone" type="tel" value="{{ order.sales_phone or '' }}" placeholder="Số điện thoại của Sales"></label></div><div class="col-md-6"><label>STK Sales<input class="form-control" name="sales_bank_account" value="{{ order.sales_bank_account or '' }}" placeholder="Số tài khoản ngân hàng của Sales"></label></div></div>
<div class="table-responsive"><table class="table"><thead><tr><th>Mã</th><th>Sản phẩm</th><th>ĐVT</th><th>SL</th><th>Đơn giá</th></tr></thead><tbody>{% for item in order.items %}<tr><td><input class="form-control" name="product_code" value="{{ item.product_code or '' }}"></td><td><input class="form-control" name="product_name" value="{{ item.product_name }}"></td><td><input class="form-control" name="unit" value="{{ item.unit or '' }}"></td><td><input class="form-control" name="quantity" type="number" step="0.01" value="{{ item.quantity }}"></td><td><input class="form-control" name="unit_price" type="number" step="1000" value="{{ item.unit_price }}"></td></tr>{% endfor %}</tbody></table></div>
<label>Ghi chú<textarea class="form-control" name="note">{{ order.note or '' }}</textarea></label><button class="btn primary-btn mt-3">Lưu thay đổi</button>
</form>
{% endblock %}
