{% extends 'base.html' %}
{% block content %}
  <div class="section-header">
    <div>
      <p class="kpi-label mb-2">Quản lý khách hàng</p>
      <h1 class="page-title">{% if action == 'add' %}Thêm khách hàng{% else %}Sửa khách hàng{% endif %}</h1>
    </div>
  </div>

  <div class="panel p-4">
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Tên</label>
          <input class="form-control" name="name" value="{{ c.name if c else '' }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Facebook ID</label>
          <input class="form-control" name="facebook_id" value="{{ c.facebook_id if c else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Email</label>
          <input class="form-control" name="email" value="{{ c.email if c else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Phone</label>
          <input class="form-control" name="phone" value="{{ c.phone if c else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Vị trí</label>
          <input class="form-control" name="location" value="{{ c.location if c else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Tags (phân cách bằng dấu phẩy)</label>
          <input class="form-control" name="tags" value="{{ c.tags if c else '' }}" placeholder="VIP, Tiềm năng, Hà Nội">
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Ghi chú</label>
          <textarea class="form-control" name="notes" rows="5">{{ c.notes if c else '' }}</textarea>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button class="btn primary-btn">Lưu</button>
        <a class="btn secondary-btn" href="/customers">Hủy</a>
      </div>
    </form>
  </div>
{% endblock %}
