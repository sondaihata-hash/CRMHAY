{% extends 'base.html' %}
{% block content %}
<div class="section-header"><div><p class="kpi-label mb-2">Đơn hàng {{ order.code }}</p><h1 class="page-title">Nội dung gửi sản xuất</h1></div><a class="btn secondary-btn" href="/orders">Quay lại đơn hàng</a></div>
<section class="panel p-4" style="max-width:760px;margin:auto">
  <p class="text-secondary">Nội dung dưới đây đã ẩn tên khách, số điện thoại, giá tiền và địa chỉ. Hãy sao chép và gửi cho nhân viên sản xuất trên Zalo.</p>
  <textarea id="production-message" class="form-control" rows="12" readonly>{{ production_message }}</textarea>
  <div class="toolbar mt-3"><button class="btn primary-btn" type="button" onclick="navigator.clipboard.writeText(document.getElementById('production-message').value);this.textContent='Đã sao chép'">Sao chép nội dung</button><a class="btn success-btn" href="https://zalo.me" target="_blank" rel="noopener">Mở Zalo</a></div>
</section>
{% endblock %}
