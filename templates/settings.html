{% extends 'base.html' %}
{% block content %}
  <div class="section-header">
    <div>
      <p class="kpi-label mb-2">Cấu hình hệ thống</p>
      <h1 class="page-title">Cài đặt</h1>
    </div>
  </div>

  <div class="panel p-3 p-md-4 mb-4">
    <form class="row g-3 align-items-end" action="/settings/add" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="col-md-4">
        <label class="form-label fw-semibold">Key</label>
        <input name="key" class="form-control" placeholder="Ví dụ: FACEBOOK_SYSTEM_USER_ACCESS_TOKEN">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Value</label>
        <input name="value" class="form-control" placeholder="Nhập giá trị">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold">Mô tả</label>
        <input name="description" class="form-control" placeholder="Mô tả cài đặt">
      </div>
      <div class="col-md-1 d-grid">
        <button class="btn primary-btn">Thêm</button>
      </div>
    </form>
  </div>

  <div class="panel table-card">
    <div class="table-responsive">
      <table class="table mb-0 align-middle">
        <thead>
          <tr>
            <th>Key</th>
            <th>Value</th>
            <th>Mô tả</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody>
          {% for s in items %}
          <tr>
            <td><span class="badge-soft">{{ s.key }}</span></td>
            <td>{{ s.value or '—' }}</td>
            <td>{{ s.description or '—' }}</td>
            <td>
              <div class="d-flex gap-2">
                <a class="btn btn-sm btn-outline-secondary action-btn" href="/settings/{{ s.id }}/edit">Sửa</a>
                <form action="/settings/{{ s.id }}/delete" method="post" onsubmit="return confirm('Xóa cài đặt này?')">
                  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                  <button class="btn btn-sm btn-danger action-btn">Xóa</button>
                </form>
              </div>
            </td>
          </tr>
          {% else %}
          <tr>
            <td colspan="4" class="text-center text-muted py-4">Không có cài đặt nào.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
