<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRM Facebook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --bg: #f3f7fb;
        --panel: #ffffff;
        --panel-soft: #edf3ff;
        --primary: #2563eb;
        --primary-strong: #1d4ed8;
        --primary-soft: #dfeafe;
        --accent: #14b8a6;
        --text: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        background: linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .topbar {
        background: linear-gradient(90deg, #0f172a 0%, #111827 100%);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
      }

      .topbar .page-shell {
        margin-top: 0;
        margin-bottom: 0;
      }

      .brand {
        letter-spacing: 0.02em;
        font-weight: 700;
        font-size: 1.6rem;
      }

      .nav-link {
        font-weight: 500;
        color: rgba(255,255,255,0.75) !important;
        padding: 0.7rem 1rem !important;
        border-radius: 0.75rem;
        transition: all 0.2s ease;
      }

      .nav-link:hover, .nav-link.active {
        background: rgba(255,255,255,0.07);
        color: white !important;
      }

      .page-shell {
        max-width: 1280px;
        margin: 2rem auto 3rem;
        padding: 0 1rem;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 1.2rem;
        box-shadow: var(--shadow);
      }

      .alert {
        border: none;
        border-radius: 0.9rem;
        padding: 1rem 1.2rem;
        font-weight: 500;
        box-shadow: 0 8px 20px rgba(15,23,42,0.04);
      }

      .alert-success { background: rgba(16,185,129,0.12); color: #047857; }
      .alert-danger { background: rgba(239,68,68,0.10); color: #b91c1c; }
      .alert-warning { background: rgba(245,158,11,0.12); color: #b45309; }
      .alert-info { background: rgba(59,130,246,0.10); color: #1d4ed8; }

      .primary-btn {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
        border: none;
        color: white;
        font-weight: 600;
        padding: 0.8rem 1.2rem;
        border-radius: 0.85rem;
        box-shadow: 0 8px 18px rgba(37,99,235,0.22);
      }

      .secondary-btn {
        background: white;
        border: 1px solid var(--line);
        color: var(--text);
        font-weight: 600;
        padding: 0.8rem 1.2rem;
        border-radius: 0.85rem;
      }

      .success-btn {
        background: linear-gradient(135deg, var(--accent) 0%, #0ea5a4 100%);
        border: none;
        color: white;
      }

      .page-title {
        font-size: clamp(2rem, 3vw, 3rem);
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.04em;
        margin: 0;
      }

      .kpi-card {
        border: 1px solid var(--line);
        border-radius: 1.1rem;
        background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
        box-shadow: 0 10px 28px rgba(15,23,42,0.04);
        padding: 1.15rem 1.2rem;
      }

      .kpi-label {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      }

      .kpi-value {
        font-size: 1.8rem;
        font-weight: 800;
        margin-top: 0.4rem;
      }

      .section-title {
        font-size: 1.35rem;
        font-weight: 800;
        margin: 0.35rem 0 0;
      }

      .metric-card {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        min-height: 112px;
      }

      .metric-icon {
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.8rem;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .metric-blue { background: #e0eaff; color: #1d4ed8; }
      .metric-teal { background: #d8f7f0; color: #087f6e; }
      .metric-amber { background: #fff0c7; color: #a16207; }
      .metric-coral { background: #ffe2dc; color: #c2410c; }
      .metric-money { font-size: 1.35rem; }
      .metric-money small { font-size: 0.75rem; color: var(--muted); }
      .summary-total { color: var(--primary-strong); font-size: 1.05rem; }

      .revenue-stage {
        min-height: 154px;
        border-bottom: 1px solid var(--line);
        background: repeating-linear-gradient(to bottom, transparent 0, transparent 50px, #eef3f8 51px);
        position: relative;
        overflow: hidden;
      }

      .revenue-line {
        position: absolute;
        left: 0;
        right: 6%;
        bottom: 28px;
        height: 88px;
        background: linear-gradient(145deg, transparent 49%, rgba(20,184,166,0.22) 50%, rgba(20,184,166,0.22) 51%, transparent 52%);
        border-bottom: 3px solid var(--accent);
        clip-path: polygon(0 72%, 15% 62%, 28% 68%, 43% 38%, 59% 49%, 72% 23%, 84% 34%, 100% 8%, 100% 100%, 0 100%);
      }

      .revenue-label { position: absolute; font-size: 0.72rem; color: var(--muted); }
      .revenue-label-top { top: 12px; right: 0; }
      .revenue-label-bottom { bottom: 8px; left: 0; }
      .distribution-row { margin-bottom: 1.1rem; }
      .progress-track { height: 8px; border-radius: 99px; background: #edf2f7; overflow: hidden; }
      .progress-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--accent)); }
      .pipeline-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.8rem 0; border-bottom: 1px solid #edf2f7; }
      .pipeline-row:last-child { border-bottom: 0; }
      .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(20,184,166,0.12); }
      .status-pill { display: inline-flex; padding: 0.38rem 0.65rem; border-radius: 999px; background: #e7f3ff; color: #1d4ed8; font-size: 0.75rem; font-weight: 700; }

      .form-control, .form-select, textarea {
        border: 1px solid #dfe7f3;
        border-radius: 0.8rem;
        padding: 0.8rem 0.9rem;
        background: #fff;
      }

      .form-control:focus, .form-select:focus, textarea:focus {
        border-color: rgba(37,99,235,0.5);
        box-shadow: 0 0 0 0.2rem rgba(37,99,235,0.12);
      }

      .table-card {
        overflow: hidden;
      }

      .customer-list-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 1rem;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 700;
        border-bottom: 1px solid var(--line);
      }

      .customer-list-scroll {
        max-height: 560px;
        overflow: auto;
        scrollbar-color: #94a3b8 #eef2f7;
        scrollbar-width: thin;
      }

      .customer-list-scroll thead th {
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .table thead th {
        background: #f8fafc;
        color: #475569;
        border-bottom: 1px solid var(--line);
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        padding: 1rem 0.9rem;
      }

      .table tbody td {
        vertical-align: middle;
        padding: 1rem 0.9rem;
        border-color: #edf2f7;
        color: var(--text);
      }

      .table tbody tr:hover {
        background: #f8fbff;
      }

      .badge-soft {
        display: inline-flex;
        align-items: center;
        background: var(--primary-soft);
        color: var(--primary-strong);
        border-radius: 999px;
        padding: 0.4rem 0.7rem;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .action-btn {
        border-radius: 0.65rem;
        padding: 0.45rem 0.8rem;
        font-weight: 600;
      }

      .btn-link-like {
        text-decoration: none;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.4rem;
      }

      .toolbar {
        display: flex;
        gap: 0.9rem;
        align-items: center;
        flex-wrap: wrap;
      }

      @media (max-width: 767.98px) {
        .page-shell { padding: 0 0.8rem; }
        .section-header { align-items: flex-start; flex-direction: column; }
        .toolbar { width: 100%; }
        .toolbar > * { flex: 1 1 100%; }
      }
    </style>
  </head>
  <body>
    <nav class="topbar navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid page-shell px-0">
        <a class="navbar-brand brand" href="/">CRM HAY</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-label="Mở menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/">Tổng quan</a></li>
            <li class="nav-item"><a class="nav-link" href="/customers">Khách hàng</a></li>
            <li class="nav-item"><a class="nav-link" href="/orders">Đơn hàng</a></li>
            <li class="nav-item"><a class="nav-link" href="/sales-groups">Nhóm Sales</a></li>
            <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="page-shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, msg in messages %}
            <div class="alert alert-{{ category }} mb-4">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
